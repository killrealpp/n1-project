[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "n1-project"
version = "0.1.0"
description = "Telegram-to-Russian publishing automation for VK, MAX, Telegram, and Dzen bridge"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "telethon>=1.36",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
n1-worker = "n1_project.worker:main"
n1-telegram-session = "n1_project.telegram_session:main"

[tool.hatch.build.targets.wheel]
packages = ["src/n1_project"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
